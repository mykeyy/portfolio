<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spec sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #061ecf; color: #fff; }
  body { font-family: "Roboto Mono", monospace; font-weight: 700; }
  .page { padding: 32px 56px; }
  header { display: flex; justify-content: space-between; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { font-family: Anton, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 192px; line-height: 0.82; white-space: nowrap; margin-top: 64px; }
  dl { margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; border-top: 2px solid #fff; }
  .row { display: grid; grid-template-columns: 9em 1fr auto; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 2px solid #fff; font-size: 30px; text-transform: uppercase; letter-spacing: 0.02em; }
  .row dt { font-size: 22px; }
  .row dd b { font-family: Anton, sans-serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: 0.01em; }
  .row .go { font-size: 22px; }
  .row.hot { background: #fff; color: #061ecf; margin: 0 -12px; padding: 14px 12px; }
</style>
</head>
<body>
  <div class="page">
    <header><span>myky.cc</span><span>Spec sheet / 2026</span></header>

    <h1>Mykey Nishikawa</h1>

    <dl>
      <div class="row"><dt>Based in</dt><dd>Philippines</dd><span class="go"></span></div>
      <div class="row hot"><dt>Projects</dt><dd><b>03</b></dd><span class="go">Open</span></div>
      <div class="row"><dt>Does</dt><dd>Development, design</dd><span class="go"></span></div>
      <div class="row"><dt>Research</dt><dd><b>01</b></dd><span class="go">Open</span></div>
      <div class="row"><dt>Visitors</dt><dd>1,204</dd><span class="go"></span></div>
      <div class="row"><dt>Notes</dt><dd><b>03</b></dd><span class="go">Open</span></div>
      <div class="row"><dt>Contact</dt><dd>hello@mykeyy.tech</dd><span class="go">Write</span></div>
      <div class="row"><dt>About</dt><dd>Who, what, why</dd><span class="go">Open</span></div>
    </dl>
  </div>
</body>
</html>
