<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>myky.cc share image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Source for og.png, the image link previews show (Discord, X, iMessage, and so on).
       Open this file in a browser at 1200 x 675 and screenshot it, or render it with headless Chrome. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 675px;
      overflow: hidden;
      background: #061ecf;
      color: #ffffff;
      font-family: "Roboto Mono", ui-monospace, Consolas, monospace;
      font-weight: 700;
    }

    body { position: relative; }

    /* The torus is centred on this point */
    pre {
      position: absolute;
      left: 420px;
      top: 6px;
      font-size: 20px;
      line-height: 1.1;
      opacity: 0.9;
    }

    h1 {
      position: absolute;
      left: 80px;
      bottom: 76px;
      font-size: 88px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <pre id="donut"></pre>
  <h1>Mykey Nishikawa</h1>

  <script>
    // The same ASCII donut as the site, drawn once at a chosen angle.
    function drawDonut(A, B) {
      const W = 80, H = 22;
      const out = new Array(W * H).fill(" ");
      const depth = new Array(W * H).fill(0);
      const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
      for (let j = 0; j < 6.28; j += 0.035) {
        const ct = Math.cos(j), st = Math.sin(j);
        for (let i = 0; i < 6.28; i += 0.01) {
          const sp = Math.sin(i), cp = Math.cos(i);
          const h = ct + 2;
          const D = 1 / (sp * h * sA + st * cA + 5);
          const t = sp * h * cA - st * sA;
          const x = Math.floor(40 + 30 * D * (cp * h * cB - t * sB));
          const y = Math.floor(12 + 15 * D * (cp * h * sB + t * cB));
          const o = x + W * y;
          const N = Math.floor(8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));
          if (y >= 0 && y < H && x >= 0 && x < W && D > depth[o]) {
            depth[o] = D;
            out[o] = ".,-~:;=!*#$@"[N > 0 ? N : 0];
          }
        }
      }
      let text = "";
      for (let y = 0; y < H; y++) text += out.slice(y * W, y * W + W).join("") + "\n";
      return text;
    }

    // Face-on (0, 0), so the whole ring and its hole read as a "0". Try ?a=0.3&b=0.2 for a slight tilt.
    const angles = new URLSearchParams(location.search);
    const angle = (name, fallback) => (angles.has(name) ? parseFloat(angles.get(name)) : fallback);
    document.getElementById("donut").textContent = drawDonut(angle("a", 0), angle("b", 0));
  </script>
</body>
</html>
