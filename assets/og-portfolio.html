<!doctype html>
<!-- Source of public/og.png on the portfolio branch: the link-preview card, 1200 x 630.
     Render it at exactly that size with headless Chrome (see README, "Link preview"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>myky.cc link preview</title>
<style>
  @font-face { font-family: "Anton"; src: url("../public/fonts/anton-latin.woff2") format("woff2"); }
  @font-face { font-family: "Roboto Mono"; font-weight: 700; src: url("../public/fonts/roboto-mono-700-latin.woff2") format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #061ecf; color: #fff; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px;
    font-family: "Roboto Mono", monospace;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { background: #fff; color: #061ecf; padding: 4px 10px; margin-left: -10px; }

  /* Ink spans the 1088px column: 1088 / 6.764em of ink = 160.85px, side bearing pulled back by 0.03125em */
  h1 {
    font-family: Anton, sans-serif;
    font-weight: 400;
    font-size: 160.85px;
    line-height: 0.84;
    letter-spacing: 0;
    white-space: nowrap;
    margin-left: -0.03125em;
  }

  .line { display: flex; justify-content: space-between; margin-top: 22px; }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">myky.cc</span>
    <span>Projects, research, notes</span>
  </div>
  <div>
    <h1>Mykey Nishikawa</h1>
    <p class="line"><span>Independent developer and designer</span><span>Philippines, UTC+8</span></p>
  </div>
</body>
</html>
